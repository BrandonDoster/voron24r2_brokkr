# Fans
[multi_pin part_cooling] #EBB36g2
pins: EBBCan:PD3, EBBCan:PA5 #EBB36g2

[fan]
pin: multi_pin:part_cooling #EBB36g2
# pin: EBBCan:gpio13 #SB2209

[heater_fan heatbreak_fan]
# pin: EBBCan:gpio14 #SB2209
pin: EBBCan:PD2 #EBB36g2
tachometer_pin: EBBCan:PA4 #EBB36g2
heater: extruder
heater_temp: 70.0

# [fan_generic ebb] #SB2209
# pin: EBBCan:gpio6 #SB2209
# kick_start_time: 0.5 #SB2209
# off_below: 0.10 #SB2209

[fan_generic nevermore]
pin: PF9
kick_start_time: 0.5
off_below: 0.10

[fan_generic bed_fans]
pin: PF6
kick_start_time: 0.5
off_below: 0.10

[fan_generic stepper_fan]
pin: PF7
max_power: 1.0
shutdown_speed: 0.0
kick_start_time: 0.5

#[fan_generic pi_fan]
#pin: CB1:gpio26

# [temperature_fan cb1_Fan]
