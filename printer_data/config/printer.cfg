# LEDs
# [neopixel toolhead_light]
# # pin: EBBCan:gpio16 #SB2209
# pin: EBBCan:PC7 #EBB36g2
# chain_count: 3 #SB2209
# color_order: GRBW #SB2209

[output_pin caselight]
#Chamber Lighting - HE3 Connector
pin: PA5
pwm:true
shutdown_value: 0
cycle_time: 0.01

# Homing and Gantry Adjustment
[idle_timeout]
timeout: 3300

[safe_z_home]
home_xy_position: 150,150 # 125,125/150,150/175,175
speed: 100
z_hop: 10

[quad_gantry_level]
##	Use QUAD_GANTRY_LEVEL to level a gantry.
##	Min & Max gantry corners - measure from nozzle at MIN (0,0) and 
##	MAX (250, 250), (300,300), or (350,350) depending on your printer size
##	to respective belt positions
##	Gantry Corners
gantry_corners:
	-60,-10
	360,370 # 310,320/360,370/410,420
## Probe points
points:
	50,25
	50,225 # 50,175/50,225/50,275
	250,225 # 200,175/250,225/300,275
	250,25 # 200,25/250,25/300,25
speed: 100
horizontal_move_z: 10
retries: 10
retry_tolerance: 0.0075
max_adjust: 10

[bed_mesh]
speed: 300
horizontal_move_z: 5
# mesh_min: 10,10
# mesh_max: 290,290 # 240,240/290,290/340,340
mesh_min: 40, 40
mesh_max: 260,260
algorithm: bicubic
# zero_reference_position: 150,150 #for use with stock z endstop

# [adxl345] #SB2209
# cs_pin: EBBCan:gpio1 #SB2209 
# spi_software_sclk_pin: EBBCan:gpio2 #SB2209
# spi_software_mosi_pin: EBBCan:gpio0 #SB2209
# spi_software_miso_pin: EBBCan:gpio3 #SB2209
# axes_map: z,-y,x #SB2209

[lis2dw EBB36g2] #EBB36g2
cs_pin: EBBCan:PB1 #EBB36g2
spi_bus:spi2_PB2_PB11_PB10 #EBB36g2
axes_map: x,y,z #EBB36g2`

[resonance_tester]
probe_points: 150, 150, 20 # 125, 125/150, 150/175, 175
accel_chip: lis2dw EBB36g2

[board_pins]
aliases:
    # EXP1 header
    EXP1_1=PE7, EXP1_2=PG1,
    EXP1_3=PG0, EXP1_4=PF15,
    EXP1_5=PF14, EXP1_6=PF13,    # Slot in the socket on this side
    EXP1_7=PF12, EXP1_8=PF11,
    EXP1_9=<GND>, EXP1_10=<5V>,

    # EXP2 header
    EXP2_1=PE13, EXP2_2=PE12,
    EXP2_3=PE15, EXP2_4=PE11,
    EXP2_5=PE10, EXP2_6=PE14,      # Slot in the socket on this side
    EXP2_7=PE8, EXP2_8=<RST>,
    EXP2_9=<GND>, EXP2_10=<NC>

# Core Macros
[delayed_gcode _Printer_Bootup]
initial_duration: 1
gcode:
  SET_FAN_SPEED FAN=stepper_fan SPEED=1
  SET_PIN PIN=caselight VALUE=0.50

[gcode_macro G32]
gcode:
    BED_MESH_CLEAR
    G28
    QUAD_GANTRY_LEVEL
    G28
    G0 X150 Y150 Z30 F3600 # X125 Y125/X150 Y150/X175 Y175

