# [force_move] 
# enable_force_move: true 
# [include mmb_can_v2.cfg]
[include macros/*.cfg]
[include mainsail.cfg]
[include cartographer.cfg]
[include goose_purge.cfg]
[exclude_object]
[gcode_arcs]
[axis_twist_compensation]
[skew_correction]
# Happy-Hare
[include mmu/base/*.cfg]
[include mmu/addons/mmu_eject_buttons.cfg]
[include mmu/optional/client_macros.cfg]
[include emu_macros.cfg]

[mcu CB1]
serial: /tmp/klipper_host_mcu

# Core
[mcu]
canbus_uuid: e1f2017faf04

[mcu EBBCan]
# canbus_uuid: e07809430fa5 #SB2209
# canbus_uuid: b22b8207693a #EBB36g2
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_19000A000450315741363420-if00
restart_method: command

[mcu cartographer]
# canbus_uuid: bb45ba88481b
serial: /dev/serial/by-id/usb-Cartographer_stm32g431xx_480044000C50315447313620-if00
restart_method: command

[printer]
kinematics: corexy
max_velocity: 300  
max_accel: 10000    			
max_z_velocity: 30 			
max_z_accel: 350
square_corner_velocity: 5.0

[temperature_sensor MCU]
sensor_type: temperature_mcu

[temperature_sensor SoC]
sensor_type: temperature_host

[temperature_sensor EBB]
sensor_type: Generic 3950
# sensor_pin: EBBCan:gpio28 #SB2209
sensor_pin: EBBCan:PA0 #EBB36g2
pullup_resistor: 2200 #EBB36g2

# [temperature_sensor chamber]
# sensor_type: Generic 3950
# sensor_pin: PB0
# min_temp: 0
# max_temp: 100
# gcode_id: C

# Motors
## X (B) Motor 6
[stepper_x]
step_pin: PG9
dir_pin: PD7
enable_pin: !PG11
microsteps: 16
rotation_distance: 40
full_steps_per_rotation:200  #set to 400 for 0.9 degree stepper
# endstop_pin: ^EBBCan:gpio24 #SB2209
endstop_pin: ^EBBCan:PA15 #EBB36g2
position_min: 0
position_endstop: 300 # 250/300/350
position_max: 300 # 250/300/350
homing_speed: 75
homing_retract_dist: 5
homing_positive_dir: true

## Y (A) Motor5
[stepper_y]
step_pin: PG13
dir_pin: PG12
enable_pin: !PG15
microsteps: 16
rotation_distance: 40
endstop_pin: ^PF4
full_steps_per_rotation:200  #set to 400 for 0.9 degree stepper
position_min: 0
position_endstop: 305 # 250/300/350
position_max: 305 # 250/300/350
homing_speed: 75
homing_retract_dist: 5
homing_positive_dir: true

## Z0 (FL) Motor4
[stepper_z]
step_pin: PB4
dir_pin: PB3
enable_pin: !PB6
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16
endstop_pin: probe:z_virtual_endstop
position_max: 290 # 240/290/340
position_min: -5
homing_speed: 8
second_homing_speed: 3
homing_retract_dist: 0

##	Z1 (RL) Motor3
[stepper_z1]
step_pin: PB8
dir_pin: !PB7
enable_pin: !PE0
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16

##	Z2 (RR) Motor2
[stepper_z2]
step_pin: PE2
dir_pin: PE1
enable_pin: !PE4
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16

##	Z3 (FR) Motor1
[stepper_z3]
step_pin: PE6
dir_pin: !PE5
enable_pin: !PC14
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16

# Extruder
## E0 on SB2209
[extruder]
# step_pin: EBBCan:gpio18 #SB2209
# dir_pin: EBBCan:gpio19 #SB2209
# enable_pin: !EBBCan:gpio17 #SB2209
step_pin: EBBCan:PB14 #EBB36g2
dir_pin: EBBCan:PA8 #EBB36g2
enable_pin: !EBBCan:PB6 #EBB36g2
microsteps: 16
rotation_distance: 47.088
gear_ratio: 9:1
nozzle_diameter: 0.400
filament_diameter: 1.750
# heater_pin: EBBCan:gpio7 #SB2209
heater_pin: EBBCan:PB4 #EBB36g2
#control: pid
min_extrude_temp: 0
min_temp: 0
max_temp: 315
max_extrude_only_distance: 105
max_extrude_only_velocity: 50
max_extrude_cross_section: 5
max_power: 1
#pid_kp: 21.527
#pid_ki: 1.063
#pid_kd: 108.982
# sensor_type: MAX31865 #SB2209
sensor_type: PT1000 #EBB36g2
sensor_pin: EBBCan:PA3 #EBB36g2
pullup_resistor: 2200 #EBB36g2
# sensor_pin: EBBCan:gpio9 #SB2209
# spi_software_sclk_pin: EBBCan:gpio10 #SB2209
# spi_software_mosi_pin: EBBCan:gpio8 #SB2209
# spi_software_miso_pin: EBBCan:gpio11 #SB2209
# rtd_nominal_r: 100 #SB2209
# rtd_reference_r: 430 #SB2209
# rtd_num_of_wires: 2 #SB2209

# Stepper Drivers
[tmc2209 stepper_x]
uart_pin: PG10
#diag_pin: PF4
run_current: 0.9
interpolate: True
# sense_resistor: 0.110
stealthchop_threshold: 1

[tmc2209 stepper_y]
uart_pin: PG14
#diag_pin: 
run_current: 0.9
interpolate: True
# sense_resistor: 0.110
stealthchop_threshold: 1

[tmc2209 stepper_z]
uart_pin: PB5
#diag_pin: PF1
run_current: 1.0
interpolate: true
# sense_resistor: 0.110
stealthchop_threshold: 1

[tmc2209 stepper_z1]
uart_pin: PB9
#diag_pin: PF2
run_current: 1.0
interpolate: true
# sense_resistor: 0.110
stealthchop_threshold: 1

[tmc2209 stepper_z2]
uart_pin: PE3
#diag_pin: PF3
run_current: 1.0
interpolate: true
# sense_resistor: 0.110
stealthchop_threshold: 1

[tmc2209 stepper_z3]
uart_pin: PC13
#diag_pin: PF4
run_current: 1.0
interpolate: true
# sense_resistor: 0.110
stealthchop_threshold: 1


[tmc2209 extruder]
# uart_pin: EBBCan:gpio20 #SB2209
uart_pin: EBBCan:PB3 #EBB36g2
run_current: 0.6
stealthchop_threshold: 1

