[gcode_macro _PSTART_1]
description: Part 1 of Print Start: Homing, leveling, mesh, and nozzle prep
gcode:
    # 1. Parse parameters with robust defaults to allow safe console execution
    {% set target_bed = params.BED|default(60)|int %}
    {% set target_extruder = params.EXTRUDER|default(200)|int %}
    {% set target_chamber = params.CHAMBER|default(45)|int %}

    CLEAR_PAUSE                                         # Clear any lingering pause states
    SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={target_bed} # Start Bed heating (asynchronous)
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET=150   # Set Extruder to safe tap temp (asynchronous)
    
    # Optional Chamber Soak (Uncomment and adjust sensor name if you use a chamber sensor)
    # SET_DISPLAY_TEXT MSG="Chamber Soak: {target_chamber}c"
    # TEMPERATURE_WAIT SENSOR="temperature_sensor chamber" MINIMUM={target_chamber}

    _CHOME                                              # Conditional Home XYZ
    G90                                                 # Absolute positioning
    BED_MESH_CLEAR                                      # Clear old saved bed mesh
    
    SET_DISPLAY_TEXT MSG="Leveling"                     # Display status
    QUAD_GANTRY_LEVEL                                   # Level the printer via QGL
    G28 Z                                               # Home Z again after QGL to establish new Z reference
    
    SET_DISPLAY_TEXT MSG="Bed mesh"                     # Display status
    BED_MESH_CALIBRATE ADAPTIVE=1                       # Start adaptive bed mesh calibration
    
    SKEW_PROFILE LOAD=Calilantern
    
    SET_DISPLAY_TEXT MSG="Hotend: 150c - ScrubTouch"    # Display status
    M109 S150                                           # Ensure hotend is stable at 150c tap temperature
    DUMB_SCRUB X_START=35 X_END=75 Y_START=305 Z_START=2.6 REPEATS=6     # Clean nozzle tip of any soft debris
    CARTOGRAPHER_TOUCH_HOME                             # Precise Z-offset touch home

    SET_DISPLAY_TEXT MSG="Hotend: {target_extruder}c"   # Display status
    M107                                                # Turn off partcooling fan
    M109 S{target_extruder}                             # Heat the hotend to printing temp and wait
    
    SET_DISPLAY_TEXT MSG="Ready for Initial Tool"

[gcode_macro _PSTART_2]
description: Part 2 of Print Start: Final heating, initial tool load, and primeline
gcode:
    # 1. Parse parameters with robust defaults
    {% set target_bed = params.BED|default(60)|int %}
    {% set target_extruder = params.EXTRUDER|default(200)|int %}

    SET_DISPLAY_TEXT MSG="Hotend: {target_extruder}c"   # Display status
    M107                                                # Turn off partcooling fan
    M109 S{target_extruder}                             # Heat the hotend to printing temp and wait
    
    SET_DISPLAY_TEXT MSG="Bed: {target_bed}c"           # Display status
    M190 S{target_bed}                                  # Wait for the bed to fully stabilize at target temp
    
    # 2. Primeline Sequence wrapped in safe states
    SET_DISPLAY_TEXT MSG="Printing Primeline"
    SAVE_GCODE_STATE NAME=primeline_state
    
    G90                                                 # Absolute positioning
    G0 X15 Y4 Z0.4 F10000                               # Move to safe starting point
    
    G91                                                 # Switch to relative positioning for extrusion line
    M83                                                 # Switch to relative extrusion mode for primeline
    G1 X100 E20 F1000                                   # Extrude a 100mm prime line
    
    # 3. Clean up and hand off to Slicer in a known safe state
    RESTORE_GCODE_STATE NAME=primeline_state
    G90                                                 # Explicitly force Absolute Positioning
    M82                                                 # Explicitly force Absolute Extrusion mode
    SET_DISPLAY_TEXT MSG="Printing..."