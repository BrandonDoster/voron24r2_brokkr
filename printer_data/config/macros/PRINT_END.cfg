[gcode_macro PRINT_END]
description: Safely finalizes the print, clears state, cools heaters, and parks toolhead
gcode:
    # 1. Fetch printer boundaries and positions for safe Z-axis lifting
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set act_z = printer.toolhead.position.z|float %}
    
    # Calculate safe Z lift (up to 30mm, but clamped to avoid Z maximum limits)
    {% if act_z < (max_z - 31.0) %}
        {% set safe_lift = 30.0 %}
    {% else %}
        {% set safe_lift = max_z - act_z - 1.0 %}
    {% endif %}

    # 2. Setup dynamic parking coordinates fallback
    {% set bd_vars = printer["gcode_macro _BD_VARS"] %}
    {% set park_x = bd_vars.purge_location_x|default(printer.toolhead.axis_maximum.x / 2)|float %}
    {% set park_y = bd_vars.purge_location_y|default(printer.toolhead.axis_maximum.y - 10.0)|float %}

    # 3. Clear skew and save the current G-code state
    SET_SKEW CLEAR=1
    SAVE_GCODE_STATE NAME=STATE_PRINT_END

    M400                           ; Wait for buffer to clear
    G92 E0                         ; Zero the extruder

    # 4. Smart Retraction: Only retract locally if Happy Hare MMU is NOT active
    {% if printer.mmu is defined and printer.mmu.enabled %}
        {action_respond_info("PRINT_END: MMU active. Retraction skipped (handled by MMU_END).")}
    {% else %}
        {action_respond_info("PRINT_END: Standard print. Executing 10mm retraction.")}
        G1 E-10.0 F3600            ; Retract filament 10mm
    {% endif %}

    # 5. Relative movement safety sequence
    G91                            ; Relative positioning
    G0 Z1.00 X20.0 Y20.0 F20000    ; Wipe nozzle slightly to remove stringing
    
    TURN_OFF_HEATERS
    M107                           ; Turn off partcooling fan
    
    # Raise Z by the dynamically calculated safe lift amount
    G1 Z{safe_lift} F3000          ; Lift nozzle safely
    
    # 6. Absolute movement to park
    G90                            ; Absolute positioning
    G0 X{park_x} Y{park_y} F3600   ; Park nozzle at rear (uses custom vars or bed-size fallback)
    
    BED_MESH_CLEAR
    SET_STEPPER_ENABLE STEPPER=extruder ENABLE=0  ; Keep XYZ enabled (prevent sag), unpower extruder stepper
    
    # 7. Restore coordinate modes and speed settings safely without movement
    RESTORE_GCODE_STATE NAME=STATE_PRINT_END MOVE=0