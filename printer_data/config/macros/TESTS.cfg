[gcode_macro EXTRUDE_SPEED_TEST]
description: Extrude 100mm at a given speed in mm/sec
gcode:
    ; EXTRUDE_SPEED_TEST SPEED=15
    {% if params.SPEED is not defined %}
        {action_raise_error("You must specify SPEED (mm/sec). Example: EXTRUDE_SPEED_TEST SPEED=12")}
    {% endif %}

    {% set speed_mm_s = params.SPEED|float %}
    {% set speed_mm_min = speed_mm_s * 60 %}

    M83                             ; Relative extrusion mode
    G1 E100 F{speed_mm_min}         ; Extrude 100mm at SPEED mm/sec


[gcode_macro _test1]
gcode:
  M118 {printer["gcode_macro _BD_VARS"].skip_scrub}

[gcode_macro BD_TOGGLE_SCRUB]
gcode:
    {% set cur = printer["gcode_macro _BD_VARS"].skip_scrub %}
    {% set new = not cur %}
    SET_GCODE_VARIABLE MACRO=_BD_VARS VARIABLE=skip_scrub VALUE={new}
    M118 skip_scrub is now {new}


[gcode_macro DISCORD_TEST]
gcode:
  {action_call_remote_method("notify",
                             name="discord",
                             message="Testing Discord")}


[gcode_macro _BD_FILAMENT_LOAD_PROMPT]
gcode:
    RESPOND TYPE=command MSG="action:prompt_begin New Filament Loaded"
    RESPOND TYPE=command MSG="action:prompt_text Filament Load Sensor Triggered."
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    RESPOND TYPE=command MSG="action:prompt_button Load|LOAD_FILAMENT|primary"
    RESPOND TYPE=command MSG="action:prompt_button Do Nothing|RESPOND TYPE=command MSG=action:prompt_end|secondary"
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    {% if printer.idle_timeout.state|upper != "PRINTING" %}
        RESPOND TYPE=command MSG="action:prompt_button_group_start"
        RESPOND TYPE=command MSG="action:prompt_button PLA|TEST|secondary"
        RESPOND TYPE=command MSG="action:prompt_button ABS|TEST|secondary"
        RESPOND TYPE=command MSG="action:prompt_button_group_end"
    {% endif %}
    RESPOND TYPE=command MSG="action:prompt_show"


[gcode_macro X_SWEEP]
description: Sweep X axis back and forth between 0 and MAX_X a set number of times
gcode:
    {% set repeats = params.REPEATS|default(5)|int %}
    {% set feedrate = params.F|default(14000)|int %}
    {% set max_x = params.max_x|default(300)|int %}
    {% set min_x = params.min_x|default(0)|int %}

    # Ensure absolute positioning
    G90
    _CHOME

    {% for i in range(repeats) %}
        G1 X0 F{feedrate}
        G4 P1000
        G1 X{max_x} F{feedrate}
        G4 P1000
    {% endfor %}



[gcode_macro XY_GRID_SWEEP]
description: Run X_SWEEP at every 10mm Y position from 20 to 280mm
gcode:
    {% set y_start = params.Y_START|default(20)|int %}
    {% set y_end = params.Y_END|default(280)|int %}
    {% set y_increment = params.Y_INCREMENT|default(10)|int %}
    {% set x_repeats = params.REPEATS|default(5)|int %}
    {% set feedrate = params.F|default(14000)|int %}
    {% set max_x = params.MAX_X|default(300)|int %}
    {% set min_x = params.MIN_X|default(0)|int %}
    {% set z_height = params.Z|default(50)|float %}
    
    # Calculate number of Y positions
    {% set y_positions = ((y_end - y_start) / y_increment)|round(0, 'floor')|int + 1 %}
    
    {action_respond_info("XY Grid Sweep Starting:")}
    {action_respond_info("Y: %dmm to %dmm, increment: %dmm (%d positions)" % (y_start, y_end, y_increment, y_positions))}
    {action_respond_info("X sweeps per Y: %d, feedrate: %dmm/min" % (x_repeats, feedrate))}
    {action_respond_info("Total X sweeps: %d" % (y_positions * x_repeats))}
    
    SAVE_GCODE_STATE NAME=XY_GRID_STATE
    
    # Ensure absolute positioning
    G90
    _CHOME
    
    # Move to Z height
    G0 Z{z_height} F{feedrate}
    
    # Loop through Y positions
    {% for y_pos in range(y_start, y_end + 1, y_increment) %}
        {action_respond_info("Y position: %dmm (step %d/%d)" % (y_pos, loop.index, y_positions))}
        
        # Move to Y position
        G0 Y{y_pos} F{feedrate}
        
        # Run X sweeps at this Y position
        {% for i in range(x_repeats) %}
            G1 X{min_x} F{feedrate}
            G4 P1000
            G1 X{max_x} F{feedrate}
            G4 P1000
        {% endfor %}
    {% endfor %}
    
    {action_respond_info("XY Grid Sweep complete!")}
    
    RESTORE_GCODE_STATE NAME=XY_GRID_STATE