[gcode_macro EXTRUDE_SPEED_TEST]
description: Extrude 100mm at a given speed in mm/sec
gcode:
    ; EXTRUDE_SPEED_TEST SPEED=15
    {% if params.SPEED is not defined %}
        {action_raise_error("You must specify SPEED (mm/sec). Example: EXTRUDE_SPEED_TEST SPEED=12")}
    {% endif %}

    {% set speed_mm_s = params.SPEED|float %}
    {% set speed_mm_min = speed_mm_s * 60 %}

    M83                             ; Relative extrusion mode
    G1 E100 F{speed_mm_min}         ; Extrude 100mm at SPEED mm/sec


[gcode_macro _test1]
gcode:
  M118 {printer["gcode_macro _BD_VARS"].skip_scrub}

[gcode_macro BD_TOGGLE_SCRUB]
gcode:
    {% set cur = printer["gcode_macro _BD_VARS"].skip_scrub %}
    {% set new = not cur %}
    SET_GCODE_VARIABLE MACRO=_BD_VARS VARIABLE=skip_scrub VALUE={new}
    M118 skip_scrub is now {new}


[gcode_macro DISCORD_TEST]
gcode:
  {action_call_remote_method("notify",
                             name="discord",
                             message="Testing Discord")}


[gcode_macro _BD_FILAMENT_LOAD_PROMPT]
gcode:
    RESPOND TYPE=command MSG="action:prompt_begin New Filament Loaded"
    RESPOND TYPE=command MSG="action:prompt_text Filament Load Sensor Triggered."
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    RESPOND TYPE=command MSG="action:prompt_button Load|LOAD_FILAMENT|primary"
    RESPOND TYPE=command MSG="action:prompt_button Do Nothing|RESPOND TYPE=command MSG=action:prompt_end|secondary"
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    {% if printer.idle_timeout.state|upper != "PRINTING" %}
        RESPOND TYPE=command MSG="action:prompt_button_group_start"
        RESPOND TYPE=command MSG="action:prompt_button PLA|TEST|secondary"
        RESPOND TYPE=command MSG="action:prompt_button ABS|TEST|secondary"
        RESPOND TYPE=command MSG="action:prompt_button_group_end"
    {% endif %}
    RESPOND TYPE=command MSG="action:prompt_show"


[gcode_macro X_SWEEP]
description: Sweep X axis back and forth between 0 and MAX_X a set number of times
gcode:
    {% set repeats = params.REPEATS|default(5)|int %}
    {% set feedrate = params.F|default(14000)|int %}
    {% set max_x = params.max_x|default(300)|int %}
    {% set min_x = params.min_x|default(0)|int %}

    # Ensure absolute positioning
    G90
    _CHOME

    {% for i in range(repeats) %}
        G1 X0 F{feedrate}
        G4 P1000
        G1 X{max_x} F{feedrate}
        G4 P1000
    {% endfor %}


[gcode_macro XY_SWEEP]
description: Sweep X and Y axes simultaneously at different speeds to cover entire bed
gcode:
    {% set duration = params.DURATION|default(60)|int %}  # Total time in seconds
    {% set x_feedrate = params.XF|default(14000)|int %}
    {% set y_feedrate = params.YF|default(11000)|int %}  # Different speed for Y
    {% set max_x = params.MAX_X|default(280)|int %}
    {% set min_x = params.MIN_X|default(20)|int %}
    {% set max_y = params.MAX_Y|default(280)|int %}
    {% set min_y = params.MIN_Y|default(20)|int %}
    {% set z_height = params.Z|default(50)|float %}
    
    # Calculate how many cycles each axis will complete
    {% set x_range = max_x - min_x %}
    {% set y_range = max_y - min_y %}
    {% set x_time_per_cycle = (x_range * 2 * 60) / x_feedrate %}  # Time for one back-forth in seconds
    {% set y_time_per_cycle = (y_range * 2 * 60) / y_feedrate %}
    {% set x_cycles = (duration / x_time_per_cycle)|round(0, 'ceil')|int %}
    {% set y_cycles = (duration / y_time_per_cycle)|round(0, 'ceil')|int %}
    
    {action_respond_info("XY Sweep Pattern Starting:")}
    {action_respond_info("Duration: ~%d seconds" % duration)}
    {action_respond_info("X: %d-%dmm @ %dmm/min (~%.1f cycles)" % (min_x, max_x, x_feedrate, x_cycles))}
    {action_respond_info("Y: %d-%dmm @ %dmm/min (~%.1f cycles)" % (min_y, max_y, y_feedrate, y_cycles))}
    {action_respond_info("Z Height: %.1fmm" % z_height)}
    
    SAVE_GCODE_STATE NAME=XY_SWEEP_STATE
    
    # Ensure absolute positioning
    G90
    _CHOME
    
    # Move to Z height
    G0 Z{z_height} F{x_feedrate}
    
    # Move to starting position
    G0 X{min_x} Y{min_y} F{x_feedrate}
    G4 P500
    
    # Determine which axis needs more repeats
    {% set max_cycles = [x_cycles, y_cycles]|max %}
    
    {% for i in range(max_cycles) %}
        # Move X forward, Y forward (if Y cycle not complete)
        {% if i < y_cycles %}
            G1 X{max_x} Y{max_y} F{x_feedrate}
        {% else %}
            G1 X{max_x} F{x_feedrate}
        {% endif %}
        
        # Move X back, Y back (if Y cycle not complete)
        {% if i < y_cycles %}
            G1 X{min_x} Y{min_y} F{x_feedrate}
        {% else %}
            G1 X{min_x} F{x_feedrate}
        {% endif %}
    {% endfor %}
    
    {action_respond_info("XY Sweep complete!")}
    
    RESTORE_GCODE_STATE NAME=XY_SWEEP_STATE
